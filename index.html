<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Static Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
            text-align: center;
        }
        .box {
            background: white;
            padding: 30px;
            width: 60%;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Welcome to My Static Website</h1>
    <p>Your User-Agent is being logged securely.</p>
</div>

<script>
(async () => {
    const webhook = "YOUR_WEBHOOK_URL_HERE";

    const ua = navigator.userAgent;

    const ip = await fetch("https://api.ipify.org?format=json")
        .then(r => r.json())
        .then(d => d.ip);

    fetch(webhook, {
        method: "POST",
        body: JSON.stringify({
            ip: ip,
            user_agent: ua
        }),
        headers: { "Content-Type": "application/json" }
    });
})();
</script>

</body>
</html>
